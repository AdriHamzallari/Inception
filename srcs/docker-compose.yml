services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile

    image: inception-mariadb:1.0
    container_name: mariadb
    restart: on-failure

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

    secrets:
      - db_password
      - db_root_password

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - inception


  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile

    image: inception-wordpress:1.0
    container_name: wordpress
    restart: on-failure

    depends_on:
      - mariadb

    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}

      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}

      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}

    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception


  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile

    image: inception-nginx:1.0
    container_name: nginx
    restart: on-failure

    depends_on:
      - wordpress

    ports:
      - "443:443"

    volumes:
      - wordpress_data:/var/www/html:ro

    networks:
      - inception


networks:

  inception:
    name: inception-net
    driver: bridge


volumes:

  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ahamzall/data/mariadb

  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ahamzall/data/wordpress


secrets:

  db_password:
    file: ../secrets/db_password.txt

  db_root_password:
    file: ../secrets/db_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt